services:
  - type: web
    name: edusphere-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/seed.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./edusphere.db
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
